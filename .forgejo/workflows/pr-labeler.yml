name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  label-pr:
    runs-on: debian-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Label PR based on changed files
        env:
          FORGEJO_TOKEN: ${{ secrets.LABELER_TOKEN }}
        run: bash contrib/label-pr.sh
