name: Update Tools

on:
  schedule:
    - cron: "0 0 * * 1" # Run every Monday at midnight
  # Manually triggerable.
  workflow_dispatch:

jobs:
  update-tools:
    runs-on: debian-trixie
    steps:
      - uses: https://data.forgejo.org/actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6
        with:
          # Use a token associated with a user account, they open the pull request.
          # The ephemeral workflow token is sometimes user-less.
          token: ${{ secrets.RBMT }}
      - uses: ./actions/setup-rbmt
        with:
          rbmt-path: cargo-rbmt
      - name: Configure git
        run: |
          git config user.name "RBMT Bot"
          git config user.email "bot@example.com"
      - name: Update tools and commit
        run: |
          cargo rbmt tools --update
          if git add . && git commit -m "Update tools"; then
            echo "TOOL_UPDATE=true" >> $GITHUB_ENV
          fi
      - name: Create pull request using agit
        if: ${{ env.TOOL_UPDATE == 'true' }}
        run: |
          git push origin HEAD:refs/for/master/update-tools \
            -o title="Update tools" \
            -o description="Automated update to tool versions by update-tools workflow."
