name: 'Setup rbmt'
description: |
  Install cargo-rbmt, tools, and toolchains.

runs:
  using: "composite"
  steps:
    - name: Install cargo-rbmt
      shell: bash
      run: cargo install cargo-rbmt --locked
    - name: Install tools (including pinned cargo-rbmt)
      shell: bash
      run: cargo rbmt --ignore-rbmt-version tools
    - name: Install toolchains
      shell: bash
      run: cargo rbmt toolchains
