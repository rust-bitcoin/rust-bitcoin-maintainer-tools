[package]
name = "corepc-client"
version = "0.17.0"
authors = ["Tobin C. Harding <me@tobin.cc>", "Jamil Lambert <Jamil.Lambert@proton.me>"]
license = "CC0-1.0"
repository = "https://git.rust-bitcoin.org/rust-bitcoin/corepc"
description = "Bitcoin Core JSON-RPC client"
categories = ["cryptography::cryptocurrencies"]
keywords = ["bitcoin", "bitcoind", "json-rpc"]
readme = "README.md"
edition = "2021"
rust-version = "1.75.0"
exclude = ["tests", "contrib"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.rbmt.lint]
# `base64`: bitcoin (via corepc-types) uses v0.21 while jsonrpc uses v0.22.
allowed_duplicates = ["base64"]

[features]
# Enable this feature to get a blocking JSON-RPC client.
client-sync = ["jsonrpc/bitreq_http"]

[dependencies]
bitcoin = { version = "0.32.0", default-features = false, features = ["std", "serde"] }
log = "0.4"
serde = { version = "1.0.103", default-features = false, features = [ "derive", "alloc" ] }
serde_json = { version = "1.0.117" }
types = { package = "corepc-types", version = "0.16.0", path = "../types", default-features = false, features = ["std"] }

jsonrpc = { version = "0.21.0", path = "../jsonrpc", default-features = false, features = ["bitreq_http_async", "client_async"] }

[dev-dependencies]
